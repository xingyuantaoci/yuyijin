# ============================================================
# 妖股竞价选股器 APK 云端构建（GitHub Actions）
# 直接在 ubuntu runner 上安装 buildozer 打包（不依赖 Docker action）。
# 触发：push 到 main / Actions 页手动触发。
# 产物：运行页底部 Artifacts -> yaostock-apk
# ============================================================
name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libssl-dev automake cmake libffi-dev liblzma-dev

      - name: Install buildozer
        run: pip3 install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Build APK
        run: |
          # Savannah 等下载源偶发 502，buildozer 失败就自动重跑；
          # 已下载的文件缓存在 .buildozer，重跑只重试失败的那个下载。
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== buildozer attempt $i ==="
            buildozer android debug && { echo "BUILD OK on attempt $i"; break; }
            echo "attempt $i failed, retry in 15s..."
            sleep 15
          done
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaostock-apk
          path: bin/*.apk
