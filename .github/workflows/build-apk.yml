# ============================================================
# 妖股竞价选股器 APK 云端构建（GitHub Actions）
# 直接在 ubuntu runner 上安装 buildozer 打包（不依赖 Docker action）。
# 触发：push 到 main / Actions 页手动触发。
# 产物：运行页底部 Artifacts -> yaostock-apk
# ============================================================
name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libssl-dev automake cmake libffi-dev liblzma-dev

      - name: Install buildozer
        run: pip3 install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Pre-fetch freetype from reliable mirror
        run: |
          # Savannah 下载站持续 502，提前从 SourceForge 把 freetype 下到
          # p4a 的包缓存目录（PACKAGES_PATH=/home/runner/.buildozer/android/packages）；
          # p4a 检测到文件已存在就跳过该下载。同时放到构建目录做兜底。
          FT_URL="https://downloads.sourceforge.net/project/freetype/freetype2/2.10.1/freetype-2.10.1.tar.gz"
          for d in \
            "$HOME/.buildozer/android/packages" \
            ".buildozer/android/platform/build-arm64-v8a/packages/freetype"; do
            mkdir -p "$d"
            FT="$d/freetype-2.10.1.tar.gz"
            for i in 1 2 3 4 5 6; do
              echo "=== prefetch -> $FT (attempt $i) ==="
              curl -fSL --retry 3 -o "$FT" "$FT_URL" && {
                ls -la "$FT"; file "$FT"; break;
              }
              echo "attempt $i failed"; rm -f "$FT"; sleep 5
            done
          done
          test -s "$HOME/.buildozer/android/packages/freetype-2.10.1.tar.gz" \
            && file "$HOME/.buildozer/android/packages/freetype-2.10.1.tar.gz" | grep -qi gzip

      - name: Build APK
        run: |
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== buildozer attempt $i ==="
            if buildozer android debug; then ok=1; echo "BUILD OK on attempt $i"; break; fi
            echo "attempt $i failed, retry in 15s..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "::error::buildozer failed on all 8 attempts"; exit 1; fi
          ls -la bin/
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaostock-apk
          path: bin/*.apk
