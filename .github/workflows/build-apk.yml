# ============================================================
# 妖股竞价选股器 APK 云端构建（GitHub Actions）
# 直接在 ubuntu runner 上安装 buildozer 打包（不依赖 Docker action）。
# 触发：push 到 main / Actions 页手动触发。
# 产物：运行页底部 Artifacts -> yaostock-apk
# ============================================================
name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libssl-dev automake cmake libffi-dev liblzma-dev

      - name: Install buildozer
        run: pip3 install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Clone & patch python-for-android
        run: |
          # Savannah 死站持续 502。直接克隆 p4a 稳定版，把 freetype 食谱里的
          # 下载地址换成可用的 SourceForge 镜像，并让 buildozer 用这份本地 p4a。
          set -e
          git clone --depth 1 --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git
          FT=python-for-android/pythonforandroid/recipes/freetype/__init__.py
          grep -n "url" "$FT" || true
          sed -i \
            's#https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz#https://downloads.sourceforge.net/project/freetype/freetype2/{version}/freetype-{version}.tar.gz#' \
            "$FT"
          echo "=== patched freetype recipe url ==="
          grep -n "url" "$FT"

      - name: Build APK
        run: |
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== buildozer attempt $i ==="
            if buildozer android debug; then ok=1; echo "BUILD OK on attempt $i"; break; fi
            echo "attempt $i failed, retry in 15s..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "::error::buildozer failed on all 8 attempts"; exit 1; fi
          ls -la bin/
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaostock-apk
          path: bin/*.apk
