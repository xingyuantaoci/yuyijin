# ============================================================
# 妖股竞价选股器 APK 云端构建（GitHub Actions）
# 直接在 ubuntu runner 上安装 buildozer 打包（不依赖 Docker action）。
# 触发：push 到 main / Actions 页手动触发。
# 产物：运行页底部 Artifacts -> yaostock-apk
# ============================================================
name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libssl-dev automake cmake libffi-dev liblzma-dev

      - name: Install buildozer
        run: pip3 install buildozer==1.6.0 virtualenv

      - name: Pre-seed freetype source into p4a package cache
        run: |
          # Savannah 死站 502。p4a 的跳过下载逻辑：当 packages/freetype/ 下同时存在
          #   freetype-<ver>.tar.gz        （tarball 本体）
          #   .mark-freetype-<ver>.tar.gz  （空标记文件）
          # 时，它就直接复用、不再访问 Savannah。这里从 SourceForge 下载并放到位。
          # p4a v2026.05.09 用 freetype 2.14.1。
          set -e
          FT_VER="2.14.1"
          FT_DIR=".buildozer/android/platform/build-arm64-v8a/packages/freetype"
          mkdir -p "$FT_DIR"
          TARBALL="$FT_DIR/freetype-$FT_VER.tar.gz"
          for i in 1 2 3 4 5; do
            echo "=== freetype download attempt $i ==="
            curl -fSL --retry 3 -o "$TARBALL" \
              "https://downloads.sourceforge.net/project/freetype/freetype2/$FT_VER/freetype-$FT_VER.tar.gz" \
              && file "$TARBALL" | grep -qi gzip && break
            echo "attempt $i failed"; rm -f "$TARBALL"; sleep 5
          done
          test -s "$TARBALL" && file "$TARBALL" | grep -qi gzip
          touch "$FT_DIR/.mark-freetype-$FT_VER.tar.gz"
          echo "=== seeded freetype package cache ==="
          ls -la "$FT_DIR"

      - name: Build APK
        run: |
          set -e
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== buildozer attempt $i ==="
            if buildozer android debug; then ok=1; echo "BUILD OK on attempt $i"; break; fi
            echo "attempt $i failed, retry in 15s..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "::error::buildozer failed on all 8 attempts"; exit 1; fi
          ls -la bin/
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaostock-apk
          path: bin/*.apk
