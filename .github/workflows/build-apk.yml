# ============================================================
# 妖股竞价选股器 APK 云端构建（GitHub Actions）
# 直接在 ubuntu runner 上安装 buildozer 打包（不依赖 Docker action）。
# 触发：push 到 main / Actions 页手动触发。
# 产物：运行页底部 Artifacts -> yaostock-apk
# ============================================================
name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libssl-dev automake cmake libffi-dev liblzma-dev

      - name: Install buildozer
        run: pip3 install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Pre-fetch freetype from reliable mirror
        run: |
          # Savannah 下载站持续 502。p4a 判断 freetype 是否已下载完成的依据是
          # "解压后的源码目录 packages/freetype/freetype-2.10.1/" 是否存在；
          # 只放 tarball 无效（仍会重新下载）。这里从 SourceForge 下载并解压到位。
          set -e
          FT_URL="https://downloads.sourceforge.net/project/freetype/freetype2/2.10.1/freetype-2.10.1.tar.gz"
          FT_DIR=".buildozer/android/platform/build-arm64-v8a/packages/freetype"
          mkdir -p "$FT_DIR"
          TARBALL="$FT_DIR/freetype-2.10.1.tar.gz"
          for i in 1 2 3 4 5 6; do
            echo "=== freetype prefetch attempt $i ==="
            curl -fSL --retry 3 -o "$TARBALL" "$FT_URL" && file "$TARBALL" | grep -qi gzip && break
            echo "attempt $i failed"; rm -f "$TARBALL"; sleep 5
          done
          test -s "$TARBALL" && file "$TARBALL" | grep -qi gzip
          echo "=== extracting freetype ==="
          tar -xzf "$TARBALL" -C "$FT_DIR"
          test -d "$FT_DIR/freetype-2.10.1"
          echo "=== freetype ready ==="; ls -la "$FT_DIR"

      - name: Build APK
        run: |
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== buildozer attempt $i ==="
            if buildozer android debug; then ok=1; echo "BUILD OK on attempt $i"; break; fi
            echo "attempt $i failed, retry in 15s..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "::error::buildozer failed on all 8 attempts"; exit 1; fi
          ls -la bin/
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaostock-apk
          path: bin/*.apk
