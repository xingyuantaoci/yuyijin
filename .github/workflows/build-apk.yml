# ============================================================
# 妖股竞价选股器 APK 云端构建（GitHub Actions）
# 直接在 ubuntu runner 上安装 buildozer 打包（不依赖 Docker action）。
# 触发：push 到 main / Actions 页手动触发。
# 产物：运行页底部 Artifacts -> yaostock-apk
# ============================================================
name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libssl-dev automake cmake libffi-dev liblzma-dev

      - name: Install buildozer
        run: pip3 install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Build APK
        run: |
          set -e
          # 第一段：buildozer 首次运行会把 p4a 克隆到 .buildozer/android/platform/python-for-android，
          # 随后在 freetype（Savannah 死站 502）处失败。忽略这次失败，目的是拿到 p4a 源码。
          echo "=== first run: let buildozer clone p4a (expected to fail at freetype) ==="
          buildozer android debug || true

          # 第二段：直接改 buildozer 克隆下来的 p4a freetype 食谱，把死站换成 SourceForge 镜像。
          FT=.buildozer/android/platform/python-for-android/pythonforandroid/recipes/freetype/__init__.py
          echo "=== original freetype recipe url ==="; grep -n "url" "$FT"
          sed -i \
            's#https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz#https://downloads.sourceforge.net/project/freetype/freetype2/{version}/freetype-{version}.tar.gz#' \
            "$FT"
          echo "=== patched freetype recipe url ==="; grep -n "url" "$FT"

          # 第三段：真正构建（buildozer 复用已克隆且打了补丁的 p4a）。
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== buildozer attempt $i ==="
            if buildozer android debug; then ok=1; echo "BUILD OK on attempt $i"; break; fi
            echo "attempt $i failed, retry in 15s..."
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "::error::buildozer failed on all 8 attempts"; exit 1; fi
          ls -la bin/
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaostock-apk
          path: bin/*.apk
